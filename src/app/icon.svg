<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    The browser-tab icon: the same mark as components/logo.tsx, on a dark plate.

    The plate is here and not in the inline logo because a tab strip can be any
    colour, and cyan on white is barely there. Scaled to 0.82 so the round caps
    keep some air inside the rounded corners at 16px, which is the size that
    actually has to work.
  -->
  <defs>
    <linearGradient id="t" gradientUnits="userSpaceOnUse" x1="49.2" y1="7.7" x2="14.8" y2="39.6">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".3" stop-color="#2ac7ee"/>
      <stop offset=".68" stop-color="#6a8bec"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="b" gradientUnits="userSpaceOnUse" x1="14.8" y1="30" x2="49.2" y2="50">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset=".24" stop-color="#ab57f2"/>
      <stop offset=".7" stop-color="#d067b0"/>
      <stop offset="1" stop-color="#fb5c7d"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="#0d0720"/>
  <g transform="translate(32 32) scale(.82) translate(-32 -32)"
     fill="none" stroke-width="9.4" stroke-linecap="round" stroke-linejoin="round">
    <path stroke="url(#t)" d="M49.2 17.5 32 7.7 14.8 17.5 14.8 29.8 32 39.6"/>
    <path stroke="url(#b)" d="M14.8 46.5 32 56.3 49.2 46.5 49.2 34.2 32 24.4"/>
  </g>
</svg>
